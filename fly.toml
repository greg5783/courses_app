app = "swsa-courses"
primary_region = "lhr"

[build]

[env]
  PORT = "8081"
  COURSES_DIR = "/data"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  max_machines = 1

[[mounts]]
  source = "swsa_courses_data"
  destination = "/data"
